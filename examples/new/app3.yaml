apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: prometheus
  labels:
    category: monitoring
  catalog: edge-apps
spec:
  displayName: Prometheus
  shortDescription: Monitoring and alerting toolkit
  visibility: published
  provider: CNCF
  support: https://prometheus.io/community/
  homepage: https://prometheus.io

  category: application
  type: container
  reference:
    uri: quay.io/prometheus/prometheus

  # Cincinnati model with skips: stable channel skips fast-only versions
  versions:
    - version: "2.50.0"
      tag: v2.50.0
      channels: [stable, fast]
      replaces: "2.49.0"             # fast: 2.49.0 -> 2.50.0
      skips: ["2.45.0", "2.47.0"]    # stable: 2.45.0 -> 2.50.0
    - version: "2.49.0"
      tag: v2.49.0
      channels: [fast]               # fast-only
      replaces: "2.47.0"
    - version: "2.47.0"
      tag: v2.47.0
      channels: [fast]               # fast-only
      replaces: "2.45.0"
    - version: "2.45.0"
      tag: v2.45.0
      channels: [stable, fast]       # previous stable

  defaults:
    config:
      envVars:
        PROMETHEUS_RETENTION_TIME: 15d
        PROMETHEUS_LOG_LEVEL: info
      ports:
        - "9090:9090"